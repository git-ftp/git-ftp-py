name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"
  # HEAD often sits past a .devN prerelease tag, which setuptools-scm/hatch-vcs
  # cannot version ("the <tag> can't be bumped"), so every uv build/sync would
  # fail. CI builds don't need the real version, so pin one and skip git version
  # resolution. Releases are versioned by publish.yml from the tag itself.
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Man page is in sync with the CLI
        run: uv run pytest tests/unit/test_docs_sync.py -q

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # include:
        #   - { os: macos-latest, python: "3.13" }
        #   - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Git defaults
        shell: bash
        run: |
          git --version
          git config --global init.defaultBranch master
      - run: uv sync --all-groups
      - name: Library sanity (libcurl features the tests rely on)
        shell: bash
        run: |
          uv run python -c "import pycurl; v = pycurl.version_info(); print(pycurl.version); assert 'ftp' in v[8] and 'ftps' in v[8], v[8]"
          uv run python -c "import pyftpdlib, paramiko, OpenSSL; print(pyftpdlib.__ver__, paramiko.__version__, OpenSSL.__version__)"
      - name: Unit + integration tests
        shell: bash
        run: uv run pytest -m "not docker" --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: py${{ matrix.python }}
          name: py${{ matrix.python }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - name: Wheel installs and runs
        run: |
          uv run --isolated --no-project --with dist/*.whl -- git-ftp --version
          uv run --isolated --no-project --with dist/*.whl -- python -c "import gitftp; print(gitftp.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          path: dist/*

  # A real ftpd for the behaviours a library server does not reproduce.
  # Host networking on purpose: as a `services:` container the ftpd would advertise
  # its bridge address in PASV replies while the client reaches it on 127.0.0.1.
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups
      - name: Start pure-ftpd (normal) and pure-ftpd (bogus PASV address)
        run: |
          docker run -d --name ftpd --network host \
            -e PUBLICHOST=127.0.0.1 \
            -e FTP_USER_NAME=gitftp -e FTP_USER_PASS=s3cret -e FTP_USER_HOME=/home/gitftp \
            -e ADDED_FLAGS="--passiveportrange 30000:30009" \
            stilliard/pure-ftpd:latest
          docker run -d --name ftpd-badpasv --network host \
            -e PUBLICHOST=10.255.255.1 \
            -e FTP_USER_NAME=gitftp -e FTP_USER_PASS=s3cret -e FTP_USER_HOME=/home/gitftp \
            -e ADDED_FLAGS="--passiveportrange 30010:30019 --bind 127.0.0.1,2121" \
            stilliard/pure-ftpd:latest
          for port in 21 2121; do
            for i in $(seq 1 30); do nc -z 127.0.0.1 $port && break; sleep 1; done
            nc -z 127.0.0.1 $port
          done
          curl -sS --max-time 10 -u gitftp:s3cret ftp://127.0.0.1:21/ >/dev/null
      - name: Docker integration tests
        run: uv run pytest tests/docker -m docker -v
        env:
          GIT_FTP_TEST_FTP_ADDR: 127.0.0.1:21
          GIT_FTP_TEST_FTP_BADPASV_ADDR: 127.0.0.1:2121
          GIT_FTP_TEST_FTP_USER: gitftp
          GIT_FTP_TEST_FTP_PASS: s3cret
      - name: Server logs
        if: failure()
        run: docker logs ftpd; docker logs ftpd-badpasv
